name: Publicar en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-cloudflare
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Preparar archivos del sitio (carpeta dist)
        run: ./build.sh
      - name: Publicar en Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
